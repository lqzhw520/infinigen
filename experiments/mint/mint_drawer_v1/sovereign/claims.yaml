  # ── Claim 5: Physics-legal teacher rollouts ─────────────────────────────────
  - claim_id: C_PHYSICS_LEGAL_TEACHER
    current_revision: 1
    lifecycle_status: active
    superseded_by: null
    supersedes: null
    split_from: null
    split_into: []
    revisions:
      - revision: 1
        statement: "Teacher rollouts generated by Infinigen + AnyGrasp contain gripper trajectories that violate physical collision constraints. Evidence: all 25 replay rollouts fail (passed: false) with max_position_error=0.33-1.03m (gripper clips through drawer panel), and max_drawer_error=1.0 with drawer_fraction=0.0 during pull phase (world-frame delta actions are physically impossible when drawer is constrained by Infinigen physics)."
        scope: v58_teacher_data_pipeline
        status: candidate
        evidence_ids: [E004]
        change_type: create
        change_reason: "Established from active_action_contract.json audit: replay_passed=0/25 across seeds 2,7,8,9,10. Root cause A: grasp phase max_position_error 0.33-1.03m (gripper clips INTO drawer). Root cause B: pull phase world-frame delta action fails under drawer constraint. Root cause C: LIBERO real robot vs Infinigen sim physics difference."
        created_at: "2026-04-02T00:00:00+08:00"
        superseded_by: null
        superseded_by_reason: null
        supersedes: null

  # ── Claim 6: Vision encoder viewpoint/sim2real gap ─────────────────────────────────
  - claim_id: C_VISION_ALIGNMENT
    current_revision: 1
    lifecycle_status: active
    superseded_by: null
    supersedes: null
    split_from: null
    split_into: []
    revisions:
      - revision: 1
        statement: "MINT vision encoder (PaliGemma/SigLIP) cannot effectively process Infinigen synthetic images due to camera viewpoint mismatch (LIBERO eye-in-hand vs Infinigen third-person overhead) and Sim-to-Real rendering gap (LIBERO photorealistic vs Infinigen synthetic textures). v57 evidence: frozen VQ-VAE + finetuned VQ-VAE both yield 0% grasp (ever_attached=false) despite VQ-VAE learning motion successfully (EER 8.6x). The gripper never closes because the vision encoder does not understand when to close from Infinigen images."
        scope: v58_vision_encoder_adaptation
        status: candidate
        evidence_ids: [E001, E003]
        change_type: create
        change_reason: "Established from v57 lesson: LM learns motion but gripper never closes (ever_attached=false) → problem is upstream in vision encoder, not VQ-VAE tokenizer. Camera viewpoint (eye-in-hand vs overhead) and rendering gap are the likely root causes."
        created_at: "2026-04-02T01:30:00+08:00"
        superseded_by: null
        superseded_by_reason: null
        supersedes: null
