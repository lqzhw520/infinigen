        scope: simulation_only
        status: contradicted
        evidence_ids: [E001]
        change_type: create
        change_reason: "Established from D1 V57: pretrained_mint=0% grasp (independent of fine-tuning); no VQ-VAE training code in workspace; V57 3000-step finetuned also 0%."
