  # ── Claim 5: Physics-legal teacher rollouts ─────────────────────────────────
  - claim_id: C_PHYSICS_LEGAL_TEACHER
    current_revision: 1
    lifecycle_status: active
    superseded_by: null
    supersedes: null
    split_from: null
    split_into: []
    revisions:
      - revision: 1
        statement: "Teacher rollouts generated by Infinigen + AnyGrasp contain gripper trajectories that violate physical collision constraints. Evidence: all 25 replay rollouts fail (passed: false) with max_position_error=0.33-1.03m (gripper clips through drawer panel), and max_drawer_error=1.0 with drawer_fraction=0.0 during pull phase (world-frame delta actions are physically impossible when drawer is constrained by Infinigen physics)."
        scope: v58_teacher_data_pipeline
        status: candidate
        evidence_ids: [E004]
        change_type: create
        change_reason: "Established from active_action_contract.json audit: replay_passed=0/25 across seeds 2,7,8,9,10. Root cause A: grasp phase max_position_error 0.33-1.03m (gripper clips INTO drawer). Root cause B: pull phase world-frame delta action fails under drawer constraint. Root cause C: LIBERO real robot vs Infinigen sim physics difference."
        created_at: "2026-04-02T00:00:00+08:00"
        superseded_by: null
        superseded_by_reason: null
        supersedes: null

  # ── Claim 7: State/proprio contract mismatch ─────────────────────────────────
  - claim_id: C_STATE_CONTRACT
    current_revision: 1
    lifecycle_status: active
    superseded_by: null
    supersedes: null
    split_from: null
    split_into: []
    revisions:
      - revision: 1
        statement: "Infinigen observation.state[8] format is [eef_pos(3) + eef_quat(4) + gripper_binary(1)] with gripper ∈ {0,1}. LIBERO observation.state[8] format is [x,y,z, rx,ry,rz,rw, gripper_joint] where state[7] is a continuous joint position (min=-0.041, max=0.001, std=0.013), NOT binary. MINT processor_mint.py digitizes state[7] into 256 bins → text token. When Infinigen state[7]={0,1} gets quantized, it lands in completely wrong bins compared to LIBERO's continuous joint positions, causing MINT's state tokenizer to emit incoherent tokens. This is P1a and is higher priority than camera/render alignment."
        scope: v58_state_contract_alignment
        status: candidate
        evidence_ids: [E004, E005]
        change_type: create
        change_reason: "Established from stats.json audit: LIBERO state[7] std=0.013 (continuous), not binary. Infinigen drawer_robot_env._state_vector() puts binary gripper {0,1} in state[7]. MINT processor_mint.py digitizes state → text. Codex review confirms: observation.contract is higher priority than vision encoder for ever_attached=0."
        created_at: "2026-04-02T03:00:00+08:00"
        superseded_by: null
        superseded_by_reason: null
        supersedes: null
  - claim_id: C_VISION_ALIGNMENT
    current_revision: 1
    lifecycle_status: active
    superseded_by: null
    supersedes: null
    split_from: null
    split_into: []
    revisions:
      - revision: 1
        statement: "LIBERO's pretrained vision encoder expects eye-in-hand or forward-facing camera with 256x256 resolution and dual-camera (image + wrist_image). Infinigen provides third-person overhead camera at 224x224 with image + image2 naming. This camera/render mismatch is P1b, below P1a (state contract) in priority but above P2 (tokenizer)."
        scope: v58_vision_encoder_alignment
        status: candidate
        evidence_ids: [E006]
        change_type: create
        change_reason: "Established from codex review: LIBERO sim-to-sim alignment matters more than initially assessed. Camera perspective and naming schema diverge from MINT's training prior."
        created_at: "2026-04-02T01:30:00+08:00"
        superseded_by: null
        superseded_by_reason: null
        supersedes: null
