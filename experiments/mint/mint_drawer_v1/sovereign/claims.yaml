- claim_id: C_STATE_CONTRACT
  current_revision: 10
  lifecycle_status: active
  superseded_by: null
  supersedes: null
  split_from: null
  split_into: []
  revisions:
  - revision: 1
    statement: Infinigen observation.state[8] format is [eef_pos(3) + eef_quat(4)
      + gripper_binary(1)] with gripper ∈ {0,1}. LIBERO observation.state[8] format
      is [x,y,z, rx,ry,rz,rw, gripper_joint] where state[7] is a continuous joint
      position (min=-0.041, max=0.001, std=0.013), NOT binary. MINT processor_mint.py
      digitizes state[7] into 256 bins → text token. When Infinigen state[7]={0,1}
      gets quantized, it lands in completely wrong bins compared to LIBERO's continuous
      joint positions, causing MINT's state tokenizer to emit incoherent tokens. This
      is P1a and is higher priority than camera/render alignment.
    scope: v58_state_contract_alignment
    status: candidate
    evidence_ids:
    - E004
    - E005
    change_type: create
    change_reason: 'Established from stats.json audit: LIBERO state[7] std=0.013 (continuous),
      not binary. Infinigen drawer_robot_env._state_vector() puts binary gripper in
      state[7]. MINT processor_mint.py digitizes state → text. Codex review confirms:
      observation.contract is higher priority than vision encoder for ever_attached=0.'
    created_at: '2026-04-02T03:00:00+08:00'
    superseded_by: C_STATE_CONTRACT@2
    superseded_by_reason: 'dataset_builder.py was fixed (E010) but drawer_robot_env._state_vector()
      still outputs binary gripper. P1a remains unfixed in runtime. E008 confirms
      offline QA: state_action_lag FAIL. Claim updated to reflect what was fixed vs
      what remains.'
    supersedes: null
  - revision: 2
    statement: 'PARTIALLY FIXED by dataset_builder.py (E010): gripper_joint now mapped
      to LIBERO continuous range [-0.042, +0.001] during LeRobot packing, and image
      resolution changed to 256x256. REMAINING UNFIXED: drawer_robot_env._state_vector()
      still outputs binary gripper {0,1} in raw NPZ states[]. Until drawer_robot_env
      is fixed, raw Infinigen rollouts still have binary gripper and cannot be used
      directly. Additionally, state[3:7] are PyBullet EEF quaternions (norm≈1.0) vs
      LIBERO motor joint positions (norm≈3.27) — this semantic mismatch requires robosuite+MuJoCo
      migration to fully resolve.'
