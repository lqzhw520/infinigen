  # ── Claim 3: Dataset sufficiency ────────────────────────────────────────────
  - claim_id: C_DATASET_SUFFICIENT
    current_revision: 1
    lifecycle_status: active
    superseded_by: C_PHYSICS_LEGAL_TEACHER
    supersedes: null
    split_from: null
    split_into: []
    revisions:
      - revision: 1
        statement: "1,301 frames is sufficient for VQ-VAE or vision encoder adaptation."
        scope: data_scale
        status: contradicted
        evidence_ids: []
        change_type: create
        change_reason: "LIBERO uses ~50,000 frames. 1,301 frames = 2.6% of LIBERO. Target 5,000+ for meaningful adaptation. No training code exists in workspace."
        created_at: "2026-03-31T19:00:00+08:00"
        superseded_by: C_PHYSICS_LEGAL_TEACHER@1
