verified: true
scope_guardrail: |
  E021 measures offline imitation on the overfit subset only.
  It does not establish task-level success, pipeline confirmation, or image-domain conclusions.
summary: |
  V59 overfit validation — offline action imitation results only.
  Training: 200 steps on 494 frames (episodes 0-5, 49), loss 6.520→3.741 (-42.7%).
  Action eval: Pretrained RMSE=0.3081, Finetuned RMSE=0.1487 — 51.7% improvement.
  Gripper eval: Pretrained MAE=1.116, Finetuned MAE=0.245 — 78.0% improvement.
  WHAT THIS PROVES: Offline action imitation improved significantly on the training subset.
  WHAT THIS DOES NOT PROVE: Task-level overfit success in DrawerRobotEnv.
  MISSING EVIDENCE: No drawer success rate, attach/open sequence, or drawer fraction comparison.
  CONCLUSION CORRECTED: "Offline signal positive" — not a task-level confirmation.
  Env-level overfit gate required before claiming task success.
finding: V59_OFFLINE_OVERFIT_POSITIVE — TASK_CONFIRMATION_PENDING
scope_limitation: |
  This experiment measures offline action prediction quality (RMSE/MAE) on a training
  subset. It does NOT measure:
  - Drawer success rate in simulation (strict_success)
  - Attach/open sequence correctness
  - Drawer fraction / pull distance in env
  - Generalization to held-out seeds
  Without env-level evaluation, a task-level confirmation is NOT scientifically justified.
  "White images non-blocking" claim is ALSO NOT justified — only offline imitation improved.
  A/B comparison (white vs colored) and env evaluation are both required for that claim.
limitations:
  - Only 7 episodes / 494 frames (subset of full 240/19701)
  - No environment rollout evaluation
  - No pretrained vs finetuned success rate comparison in sim
  - No white vs colored image A/B test
  - Gripper improvement may reflect state memorization rather than visual understanding
  - ER_TINY white images remain an open problem
