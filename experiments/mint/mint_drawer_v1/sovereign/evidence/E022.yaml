evidence_id: E022
experiment_id: v59_overfit_env_gate
type: eval
timestamp: "2026-04-05T20:35:00+08:00"
scope: env_level_overfit_validation
verified: true
scope_guardrail: |
  E022 is a task-level execution gate for the evaluated env path.
  It does not by itself prove a single root cause, nor does it eliminate image-domain
  or simulator-compatibility factors globally.
summary: |
  V59 env-level overfit gate: NEGATIVE_GATE.
  Finetuned checkpoint achieves +51.7% action RMSE improvement in offline eval,
  but achieves ZERO drawer_fraction in simulation rollouts.
  BOTH pretrained and finetuned get 0.000 drawer_fraction on all 6 rollouts
  (3 seeds × 2 episodes, 96 steps each).
  CONCLUSION: Offline action imitation improvement does NOT translate to task success.
  Pipeline has a deeper issue: actions predicted by MINT do not open the drawer in simulation.
  NOTE ON LEGACY LABEL: The original script output used a misleading legacy label.
  That label implied finetuned ≥ pretrained, but 0.000 = 0.000 is not success.
  This is a NEGATIVE_GATE: neither policy achieves any drawer motion in simulation.
finding: V59_ENV_GATE_NEGATIVE_GATE — PIPELINE_ISSUE_DEEPER_THAN_IMAGE_QUALITY
implications:
  - offline_improvement_vs_sim_success: "Offline action RMSE +51.7%" does NOT mean "sim success > 0"
  - pretrained_baseline: Pretrained MINT also gets 0.000 drawer_fraction — suggests pretrained was never
    trained to open drawers in simulation on Infinigen data, OR there's a sim-to-sim gap
  - action_contract_mismatch: MINT predicts actions in training action space; these may not
    correspond to correct physics in DrawerRobotEnv
  - normalization_mismatch: ACTION normalization=IDENTITY means MINT output is passed directly to env.step;
    but the training action space (from Infinigen physics) may not align with what the env expects
  - full_retrain_not_justified: Training on all 19,701 frames will NOT fix this if the issue
    is action/state alignment — it is not merely insufficient data quantity
  - colored_reroll_priority: OPEN QUESTION. E022 does NOT prove white images are not the bottleneck.
    Both policies were evaluated in white-image envs. The fact that pretrained also fails
    in white images does not isolate the image-quality effect. Colored images may still
    be a significant contributing factor. P0b colored reroll remains UNDECIDED.
