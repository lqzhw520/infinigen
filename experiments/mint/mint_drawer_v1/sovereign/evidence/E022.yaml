  gate_verdict: NEGATIVE_GATE  # CORRECTED from WEAK_PASS
gate_interpretation: |
  NEGATIVE_GATE: both policies score 0.000 drawer_fraction. Neither pretrained MINT nor
  finetuned MINT can open the drawer in simulation. The gate criterion was finetuned >
  pretrained on ALL metrics. Both policies achieved 0.000. This is a pipeline failure.
  CORRECTION: the legacy label was misleading — it implied finetuned ≥ pretrained, but
  0.000 = 0.000 is not a pass on any meaningful criterion.
key_diagnostic: |
  V58 eval (2026-04-04) also reported pretrained=0.000 and finetuned=0.000 on held-out seeds.
  This is consistent with E022: pretrained MINT was never trained to open drawers in
  Infinigen simulation. However, NOTE: the original hypothesis "teacher demos were not
  successful" was DISPROVED by E023 (RCA1): all 7/7 teacher episodes are task-successful.
  The correct diagnostic is: teacher demos ARE successful, MINT improves at imitating
  them offline, but the imitated actions still do not open the drawer in simulation.
  This narrows the root cause to:
  (1) action normalization mismatch between MINT output and env.step input
  (2) state representation gap between dataset state and MINT's expected input
  (3) sim-to-sim gap (LIBERO pretraining vs Infinigen physics)
next_action_required: |
  ROOT CAUSE ANALYSIS:
  1. RCA2: Check action normalization — is MINT's IDENTITY-normalized output compatible with env.step?
  2. RCA3: Check state representation — does dataset state match MINT's expected input?
  3. P0b colored reroll: OPEN QUESTION. Not proven primary, not proven irrelevant.
     Do NOT cancel. Keep as UNDECIDED pending RCA2/RCA3 results.
  DO NOT: full V59 retrain (may repeat V58 failure)
  DO NOT: claim images are confirmed not to be the bottleneck
