key_diagnostic: |
  The critical discovery: the LeRobot dataset episode index is NOT the same as the NPZ filename
  episode index. This was the source of previous confusion where ep5 and ep49 appeared to be
  missing from physics-legal rollouts. The correct mapping requires tracing through the pack
  log's sorted file order.

  Methodology for correct mapping:
    1. V59 pack source: v58_physics_legal_rollouts (227) + p4_physics_legal_rollouts (13) = 240 files
    2. Files sorted alphabetically: first 227 are v58, last 13 are p4
    3. LeRobot episode_index = position in sorted list (0 to 239)
    4. LeRobot Ep 5 = all_files[5] = seed_007_branch3_explicit_gripper_phases_ep0.npz
    5. LeRobot Ep 49 = all_files[49] = seed_009_branch2_phase_scaled_ep2.npz

  All mapped correctly and all 7 are task-successful.
root_cause_ranking_after_rca1: |
  RCA1 eliminates teacher quality as root cause for the 7 overfit training episodes.
  Remaining hypotheses:

  Priority 1 (NOT YET TESTED):
    - RCA2: Action normalization mismatch
      MINT outputs IDENTITY-normalized actions → env.step()
      Need to verify: does MINT's action output range match what DrawerRobotEnv expects?
      The training action space comes from Infinigen physics; the eval uses the same env.
      But there may be a scaling/unit mismatch.

  Priority 2 (NOT YET TESTED):
    - RCA3: State representation gap
      LIBERO pretraining vs Infinigen state format
      State[3:7] might represent different things (joint positions vs something else)
      Need to verify: does the state vector format match?

  Priority 3 (CONFIRMED BUT NOT SOLO CAUSE — OPEN):
    - Near-white images (P0b, E020)
      Confirmed to exist in current data. Pretrained MINT also fails in white-image envs.
      E022 does NOT prove images are irrelevant — pretrained failure in white images
      is consistent with multiple hypotheses (action mismatch, state gap, OR white images).
      P0b colored reroll remains OPEN / UNDECIDED pending RCA2/RCA3.

  Priority 4 (ELIMINATED):
    - Teacher demo quality for overfit subset (RCA1, E023) — ELIMINATED for 7 episodes
    - Frozen gripper_joint (CANCELLED) — ELIMINATED for current live dataset

  RECOMMENDATION: Proceed to RCA2 (action normalization) as next step.
next_action_required: |
