summary: |
  RCA1: Verifies whether the 7 teacher demonstration episodes (used in V59 overfit
  training, episodes 0-5+49 in LeRobot dataset index) are themselves task-successful.
  This is the highest-priority question: if teacher demos themselves don't open the drawer,
  MINT learning to imitate them would be inherently limited.

  RESULT: All 7/7 episodes are 100% task-successful. Teacher quality is NOT the root cause
  for the overfit subset.

  SCOPE BOUNDARY: This conclusion applies ONLY to the 7 episodes used in V59 overfit
  training. It does NOT prove that all 240 episodes / 19,701 frames in the V59 dataset
  are free of teacher-quality issues.

  Source file mapping (LeRobot episode index → NPZ source):
    Ep 0  → seed_007_branch1_position_dominant_ep0.npz  (41 frames, success=True, max_drawer=1.000)
    Ep 1  → seed_007_branch2_phase_scaled_ep0.npz        (70 frames, success=True, max_drawer=1.000)
    Ep 2  → seed_007_branch2_phase_scaled_ep2.npz    (99 frames, success=True, max_drawer=1.000)
    Ep 3  → seed_007_branch2_phase_scaled_ep3.npz    (92 frames, success=True, max_drawer=1.000)
    Ep 4  → seed_007_branch2_phase_scaled_ep4.npz   (57 frames, success=True, max_drawer=0.976)
    Ep 5  → seed_007_branch3_explicit_gripper_phases_ep0.npz  (91 frames, success=True, max_drawer=0.953)
    Ep 49 → seed_009_branch2_phase_scaled_ep2.npz   (44 frames, success=True, max_drawer=1.000)

  IMPORTANT METHODOLOGY NOTE: The "episode index" in the LeRobot dataset does NOT correspond
  to the episode index in the NPZ filenames. The LeRobot episode index is the N-th file
  in the sorted pack order (v58_physics_legal_rollouts + p4_physics_legal_rollouts).
  This was verified by:
    1. Counting files in the V59 pack log (240 files, sorted)
    2. Mapping LeRobot episode index N to pack_log[N]
    3. Confirming episode 0 maps to seed_007_branch1_position_dominant_ep0.npz (41 frames)
       which exactly matches LeRobot Ep 0 length=41

finding: RCA1_TEACHER_QUALITY_CONFIRMED_SUCCESSFUL — NOT_ROOT_CAUSE_FOR_OVERFIT_SUBSET
implications:
  - teacher_not_successful_hypothesis: REJECTED for overfit subset — all 7 episodes are task-successful
  - teacher_quality_is_not_the_bottleneck_for_overfit_subset: CONFIRMED for 7 overfit episodes
    (does NOT generalize to all 19,701 frames in V59)
  - root_cause_narrowed_further: The failure must be in the MINT training or inference
    pipeline: action normalization, state representation, or sim-to-sim gap (LIBERO→Infinigen)
  - next_hypothesis: RCA2 (action normalization) and RCA3 (state representation) become higher priority
    now that teacher quality is cleared for the overfit subset
  - white_images_still_open: E022 and E023 together do NOT prove white images are irrelevant.
    Both env gates (pretrained and finetuned) were evaluated in white-image envs.
    The pretrained failure alone does NOT isolate image quality as non-causal.
    P0b colored reroll remains UNDECIDED, not CANCELLED.
