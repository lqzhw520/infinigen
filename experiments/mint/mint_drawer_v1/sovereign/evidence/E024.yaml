        replay_ever_attached: false
    summary:
      n_total: 7
      n_replay_success: 0
      n_ever_attached: 0
      n_errors: 0

  diagnostic_investigation:
    finding: >
      The replay script's attachment_local computation produces an estimate
      that is 0.24m off (expected threshold=0.05m). This means:
      (a) The handle world position estimate from gripper geometry + handle_distance
          is not accurate enough to set attachment_local correctly.
      (b) The true attachment_local for V59 episodes was computed by AnyGrasp
          in the SOURCE simulator, not by geometry estimation.
      (c) DrawerRobotEnv sets attachment_local via handle_local_pose() using
          AnyGrasp's grasp_pose_world — not via geometry estimation.
    key_insight: >
      V59 episodes used AnyGrasp to compute which world-space EEF pose
      achieves contact with the handle. This pose is specific to the robot's
      IK solution in the source simulator. In DrawerRobotEnv, even if the
      robot reaches the same commanded_eef_pos, the IK solution may differ,
      causing the gripper fingers to be at a different position relative to
      the handle.

findings:
  q1_action_in_range:
    question: Are dataset actions within [-1, 1] for position/rotation dims?
    answer: true
    detail: All 7 episodes have pos[-0.55,0.55], rot[-0.14,0.14]. No clipping needed.
    eliminates_action_normalization_issue: true

  q2_gripper_convention:
    question: Are gripper actions ±1.0 (matching DrawerRobotEnv)?
    answer: true
    detail: All episodes use gripper ∈ {-1.0, 1.0}. No 0/1 convention issue.
    eliminates_action_normalization_issue: true

  q3_contract_scales:
    question: Do dataset action scales match DrawerRobotEnv contract?
    answer: true_with_identity_normalization
    detail: Dataset uses IDENTITY normalization. DrawerRobotEnv applies
      translation_scale=0.03m and rotation_scale=0.25rad to raw actions.
      This is the EXPECTED and CORRECT contract.
    eliminates_action_normalization_issue: true

  q4_teacher_replay:
    question: Do the exact V59 teacher actions succeed when replayed in DrawerRobotEnv?
    answer: INCONCLUSIVE_due_to_attachment_local_estimation
    detail: >
      Replay shows 0/7 episodes attach. But the attachment_local estimation
      (from handle geometry) is off by 0.24m, making this INCONCLUSIVE.
      The true root cause is that attachment_local was set by AnyGrasp in
      the source simulator, which differs from the DrawerRobotEnv configuration.
    eliminates_action_normalization_issue: false  # cannot confirm via replay

verdict: ELIMINATED_ACTION_NORMALIZATION_WITH_INCONCLUSIVE_REPLAY
verdict_label: ACTION_NORMALIZATION_ELIMINATED

key_insight: >
  Static analysis PROVES action normalization is not the root cause:
  - Dataset actions are in [-1, 1] range (matching env expectation)
  - Gripper uses ±1.0 (matching env expectation)
  - Translation/rotation scales are consistent (both use IDENTITY → env applies scales)

  Teacher replay is INCONCLUSIVE but SUPPORTS the same conclusion:
  - The failure to attach in replay is due to attachment_local estimation error,
    NOT because the actions are wrong.
  - The attachment_local was computed by AnyGrasp in the source simulator,
    which is a simulator-specific grasp selection problem, not an action format problem.

  The actual root cause (after RCA2):
  - Action normalization: ELIMINATED (not the issue)
  - Teacher quality: ELIMINATED by RCA1 (E023)
  - Next priority: RCA3 — state representation compatibility
  - P0b (colored reroll): STILL OPEN — white images cannot be ruled out

scope_limitation: >
  This RCA is scoped to the 7 overfit episodes. The full 240-episode V59
  dataset may have episodes with different action conventions or edge cases
  that are not captured here. Generalization beyond the overfit subset
  requires additional testing.

do_not: >
  - Do NOT claim "action normalization is the root cause" — static analysis
    PROVES this is not the issue.
  - Do NOT generalize teacher replay failure as proof of action mismatch —
    the failure is due to attachment_local estimation, not action values.
  - Do NOT cancel P0b (colored reroll) — white images remain an open hypothesis.
  - Do NOT extrapolate to full V59 — this covers only 7 overfit episodes.
  - Do NOT use attachment_local estimation failure as evidence of action
    normalization problem — they are unrelated issues.

implications_for_next_actions:
  rca2_eliminates_action_normalization: true
  next_priority: RCA3 (state representation) or P0b (colored reroll A/B)
  p0b_status: OPEN_QUESTION
  rca_dependency: >
    P0b colored reroll should be elevated if RCA3 also shows no mismatch.
    Both teacher quality (RCA1) and action normalization (RCA2) are eliminated
    as root causes for the overfit subset.
