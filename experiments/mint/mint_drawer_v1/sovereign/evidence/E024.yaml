# E024 — RCA2: Action Normalization Audit (COMPLETED)
# ======================================================
# Scope: Only 7 overfit episodes (LeRobot indices 0-5, 49)
# Evidence source: rca2_v59_teacher_replay.json (artifacts/)
# Status: COMPLETED

evidence_id: E024
experiment_id: rca2_action_normalization
type: RCA
scope: overfit_subset_7_episodes
scope_guardrail: >
  All conclusions apply ONLY to the 7 overfit episodes (LeRobot episode
  indices 0,1,2,3,4,5,49). Do NOT extrapolate to the full V59 dataset
  or to the full 240-episode corpus.

timestamp: "2026-04-06T00:15:00+08:00"
hypothesis: >
  MINT output action normalization / action space mismatch prevents
  successful task completion in DrawerRobotEnv.

methodology:
  - Phase 1 (static analysis): dataset action statistics vs DrawerRobotEnv expected action space
  - Phase 2 (teacher replay): replay exact V59 training actions in DrawerRobotEnv
  - Script: scripts/mint/run_rca2_v59_teacher_replay.py

metrics:
  phase1_static_analysis:
    # 494 total frames across 7 episodes
    gripper_convention_check:
      all_unique_gripper_values: [-1.0, 1.0]
      is_binary_pm1: true
      matches_env_convention: true
      verdict: OK
      severity: OK
    action_range_check:
      pos_dims_range: [-0.55, 0.55]   # well within [-1, 1]
      rot_dims_range: [-0.14, 0.14]   # well within [-1, 1]
      gripper_range: [-1.0, 1.0]       # matches env
      out_of_range_count: 0
      verdict: OK
      severity: OK
    action_contract_check:
      translation_scale_in_dataset: IDENTITY (no normalization applied)
      translation_scale_in_env: 0.03 m
      rotation_scale_in_dataset: IDENTITY
      rotation_scale_in_env: 0.25 rad
      gripper_values_in_dataset: [-1.0, 1.0]  # matches env
      scales_consistent: true
      verdict: OK
      severity: OK

  phase2_teacher_replay:
    script: scripts/mint/run_rca2_v59_teacher_replay.py
    corrected_for:
      - render_mode bug (fixed)
      - step() return signature (4 values, not 5)
      - drawer_seed from NPZ robot_seed field (not cycling)
      - initial joint states from NPZ states array
    results:
      episode_0:  # seed_007_branch1_position_dominant_ep0
        drawer_seed: 7
        teacher_success: true
        teacher_max_drawer: 1.000
        replay_success: false
        replay_max_drawer: 0.000
        replay_ever_attached: false
        diagnosis: >
          attachment_local estimation failed — handle world position
          estimate off by 0.24m (threshold=0.05m)
      episode_1:  # seed_007_branch2_phase_scaled_ep0
        drawer_seed: 7
        teacher_success: true
        replay_success: false
        replay_ever_attached: false
      episode_2:  # seed_007_branch2_phase_scaled_ep2
        drawer_seed: 7
        teacher_success: true
        replay_success: false
        replay_ever_attached: false
      episode_3:  # seed_007_branch2_phase_scaled_ep3
        drawer_seed: 7
        teacher_success: true
        replay_success: false
        replay_ever_attached: false
      episode_4:  # seed_007_branch2_phase_scaled_ep4
        drawer_seed: 7
        teacher_success: true
        teacher_max_drawer: 0.976
        replay_success: false
        replay_ever_attached: false
      episode_5:  # seed_007_branch3_explicit_gripper_phases_ep0
        drawer_seed: 7
        teacher_success: true
        teacher_max_drawer: 0.953
        replay_success: false
        replay_ever_attached: false
      episode_49:  # seed_009_branch2_phase_scaled_ep2
