  next_priority: simulator_physics_investigation
  simulator_physics_questions:
    - Why does the action that achieves attach in source sim fail to achieve attach in DrawerRobotEnv?
    - Is it contact parameters (friction, stiffness)?
    - Is it IK solution differences between simulators?
    - Is it the drawer URDF geometry (handle position, drawer dimensions)?
  policy_gap_questions:
    - Can ANY policy achieve attach in DrawerRobotEnv?
    - Has a scripted baseline (oracle) been tested in DrawerRobotEnv?
    - What is the minimum action precision needed to achieve attach?
