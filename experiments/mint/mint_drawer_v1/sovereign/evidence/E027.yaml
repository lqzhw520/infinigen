findings:

  q1_episode_quality_overall:
    question: "What is the quality distribution of the 240 V59 episodes?"
    answer: "0 task-teaching, 240 motion-only, 0 weak/noisy"
    detail: >
      Every episode has strong action variance (mean std=0.275) indicating meaningful motion.
      No episodes are weak or noisy. However, ALL episodes have near-white images
      (image_std=0.0000 within each episode).
    implication: "The dataset has MOTION QUALITY but ZERO VISUAL TEXTURE within episodes."

  q2_image_whiteness:
    question: "Are images near-white within individual episodes?"
    answer: YES
    detail: >
      240/240 episodes have image_std=0.0000 (within-episode). This is the most
      critical finding. The images are PERFECTLY homogeneous within each episode.
      This is a data-distribution fact about the stored frames, not a direct
      measurement of what SigLIP/PaliGemma or MINT can or cannot learn from them.
    implication: >
      V59 provides extremely weak within-episode visual variation.
      Whether this is sufficient for policy learning remains a separate empirical question.

  q3_gripper_action_type:
    question: "Are gripper actions binary or continuous in the V59 dataset?"
    answer: MIXED — 70% binary, 30% continuous, 0% frozen
    detail: >
      168 episodes have binary-like gripper actions (std > 0.95).
      72 episodes have continuous gripper actions (0.02 <= std <= 0.90).
      0 episodes have frozen gripper actions (std < 0.02).
      NOTE: "binary" here means the gripper opens and closes as a unit (±1.0 action),
      which is intentional for the drawer task — it is not an artifact.

  q4_action_motion_quality:
    question: "Do episodes have sufficient action variance for learning?"
    answer: YES — STRONG
    detail: >
      Action std ranges from 0.195 to 0.324 (mean 0.275), well above the 0.15 nominal
      threshold. All 240 episodes show meaningful end-effector motion.
      This confirms that episodes are not low-quality/noisy — they contain real motion.

  q5_task_teaching_episodes:
    question: "Can episodes be classified as 'task-teaching'?"
    answer: NO
    detail: >
      No episodes qualify as "task-teaching" because ALL have near-white images.
      The definition of "task-teaching" requires: (1) meaningful motion AND
      (2) non-near-white images. All episodes satisfy (1) but 0% satisfy (2).
      CRITICAL CAVEAT: NPZ source files all have success=True (drawer opened in source sim).
      But the source sim images are near-white. The "task-teaching" classification
      is based on VISUAL quality, not on whether the source sim succeeded.

combined_conclusion: >
  Gate A reveals a fundamental data distribution constraint:
  The V59 dataset has EXCELLENT ACTION QUALITY but ZERO VISUAL TEXTURE.
  
  Every episode: near-white images + strong action variance + no gripper frozen.
  Every episode: source NPZ success=True (drawer opened in source sim).
  
  But: image_std=0.0000 for ALL 240 episodes = zero within-episode visual variation
  under the Gate A metric.

  What Gate A DOES support:
    - action/state signal quality is strong enough to justify further audit
    - visual texture is extremely weak and should be treated as a major data-quality concern

  What Gate A does NOT support:
    - a final learnability verdict for MINT
    - a claim that policy learning must be action-only
    - a claim that Gate B answers policy learning

  IMPLICATION FOR GATE B:
    The teacher replayability question is whether source-sim teacher actions
    can achieve attach/open inside DrawerRobotEnv. That is a replayability /
    physics-compatibility gate, not a full policy-learning gate.

do_not: >
  - Do NOT conclude "episodes are low quality" — action quality is strong
  - Do NOT conclude "image whitening is fine" — zero visual texture is a fundamental constraint
  - Do NOT skip Gate B based on Gate A results
  - Do NOT claim "task-teaching episodes exist" — 0/240 qualify
  - Do NOT ignore the NPZ success=True labels — they show drawer was opened in source sim

gate_b_implications:
  all_240_qualify_for_replay: true
  but_image_constraint_unchanged: true
  gate_b_must_answer: >
    Do teacher actions that succeeded in the source simulator achieve attach/open
    when replayed inside DrawerRobotEnv under the current env contract?

  recommended_gate_b_scope: >
    Test REPLAYABILITY of top-10 episodes by action quality:
    episodes [157, 205, 25, 180, 3, 181, 158, 182, 138, 209]
    These have the highest action variance and longest episode lengths.
    Replay them in DrawerRobotEnv to verify the physics is compatible.

implications_for_next_actions:
  gate_a_completed: true
  gate_b_priority: HIGH
  gate_c_visual_sufficiency: >
    All 240 episodes are near-white. Gate C cannot test "richer images help"
    using the existing V59 dataset. Gate C would require RE-RECORDING the dataset
    with colored images — which is expensive. The more efficient path is to
    first complete Gate B, then decide if re-recording is justified.
  policy_learning_constraint: >
    Gate A does not resolve policy learnability. It only establishes that
    visual variation in the stored V59 frames is extremely weak, so any
    learnability claims require additional gates beyond this data audit.
