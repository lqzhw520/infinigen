experiment_id: gate_a_episode_admissibility_audit
type: learnability_audit
scope: full_v59_240_episodes
scope_guardrail: >
  Gate A classifies episodes by DATA QUALITY, not by whether MINT can learn them.
  Tier classification is a prerequisite for Gate B (Teacher Replayability).
  An episode being "task-teaching" in the source sim does NOT mean
  MINT can learn from it — Gate B must verify replayability in DrawerRobotEnv.

