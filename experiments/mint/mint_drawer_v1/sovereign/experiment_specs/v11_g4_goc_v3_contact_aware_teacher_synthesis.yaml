contact_aware_teacher_requirements:
  replay_prior_dynamic_failure:
    required: true
    record_per_step_qpos_qvel_eef_geoms_contacts_force_penetration_relative_velocity: true
  geometry_audit:
    legal_source_ids_to_audit: [63, 81, 90]
    handle_source_ids_to_audit: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    broad_link_collision_detection_required: true
    proposed_goc_v4_allowed_only_as_inactive_candidate: true
  controller_modes:
    - free_space_approach
    - guarded_approach
    - seat_and_close
    - compliant_pull
    - recovery
  dynamic_probe_pass_gate:
    target_contact_consecutive_frames_min: 5
    forbidden_contact_frames: 0
    max_penetration_m: 0.02
    max_force_n: 1000000.0
    drawer_qpos_nondecreasing_during_pull: true
    no_direct_qpos_drawer_opening: true
  optimization:
    method: CEM_or_MPPI_style_low_dimensional_sampling
    max_iterations: 5
    max_samples_per_iteration: 16
    max_probe_steps: 150

