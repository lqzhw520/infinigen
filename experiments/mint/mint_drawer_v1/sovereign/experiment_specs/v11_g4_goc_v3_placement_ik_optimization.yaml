placement_ik_optimization_requirements:
  prior_best_row_audit_required: true
  prior_best_row_expected_reset_ok: false
  objective_terms:
    - legal_pad_to_handle_distance
    - eef_to_handle_distance
    - reset_forbidden_contact_penalty
    - reset_penetration_penalty
    - reset_contact_force_penalty
    - joint_limit_margin_penalty
    - approach_frame_penalty
  optimization_variables:
    robot_base_x_range: [-1.05, -0.25]
    robot_base_y_range: [-0.25, 0.25]
    robot_base_z_range: [-0.04, 0.08]
    robot_base_yaw_deg_range: [-35, 35]
    initial_arm_qpos_7: true
    gripper_pregrasp_and_close_pose: true
  success_gates:
    reset_ok: true
    forbidden_contacts_at_reset: 0
    max_reset_penetration_m: 0.02
    max_reset_contact_force_n: 1000000.0
    legal_pad_to_handle_ik_m: 0.03
    eef_to_handle_ik_m: 0.05
    dynamic_target_contact_frames_min: 1
    dynamic_forbidden_contact_frames: 0
  terminal_interpretation:
    if_no_joint_feasible_solution: MODEL_INSTANCE_PLACEMENT_OR_KINEMATIC_CHAIN_REPAIR
    if_kinematic_feasible_but_dynamic_fails: FINGER_PAD_DYNAMIC_ROUTE_POLICY_REPAIR

attempt_reproducibility_policy:
  positive_candidate_requires_clean_committed_tree: true
  fixed_global_ids_rejected_unless_instance_verified: true
  per_instance_semantic_binding_required: true
  no_rollout_before_kinematic_and_short_dynamic_probe: true
  before_candidate_attempts_commit_runtime_patch_or_record_diff_hash: true
  non_success_telemetry_may_record_dirty_diff_hash: true
  route_repair_probe_is_not_teacher_success_claim: true

limits:
