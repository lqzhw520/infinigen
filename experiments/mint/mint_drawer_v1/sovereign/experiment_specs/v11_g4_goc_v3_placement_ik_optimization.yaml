    required: true
    fixed_global_id_reuse_allowed_only_if_semantic_surfaces_match: true
    seeds_to_probe: [1, 11, 12, 13]
    skip_missing_drawer_urdf_with_explicit_reason: true
  semantic_roles:
    legal_gripper_surfaces: named collision geoms on link5/link6/link7 matching source GOC-v3 legal roles
    forbidden_robot_surfaces: named collision geoms on link0/link1/link2/link3/link4
    drawer_handle_surfaces: contact-capable drawer_base geoms
    drawer_body_or_cabinet_surfaces: contact-capable link_1/link_2 drawer/cabinet geoms
  base_reachability_gate:
    legal_pad_to_handle_ik_threshold_m: 0.03
    eef_to_handle_ik_threshold_m: 0.05
    reset_max_penetration_m: 0.02
    reset_max_contact_force_n: 1000000.0
    reset_forbidden_contacts_required: 0
  route_synthesis_gate:
    target_frame: legal pad midpoint to drawer handle frame
    route_targets_proxy_eef_only: false
    close_before_pull_required: true
  dynamic_probe_gate:
    short_probe_only_before_bounded_rollout: true
    target_contact_required: true
    forbidden_contact_required: 0

