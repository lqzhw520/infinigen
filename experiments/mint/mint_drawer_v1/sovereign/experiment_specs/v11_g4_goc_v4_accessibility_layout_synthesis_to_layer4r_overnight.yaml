task_id: V11_G4_GOC_V4_ACCESSIBILITY_LAYOUT_SYNTHESIS_TO_LAYER4R_OVERNIGHT_V1
task_type: ACCESSIBILITY_LAYOUT_SYNTHESIS_TO_LAYER4R_SCIENCE_PHASE
