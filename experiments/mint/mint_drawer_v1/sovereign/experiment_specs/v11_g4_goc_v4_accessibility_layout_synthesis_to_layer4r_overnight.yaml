  goc_contract: experiments/mint/mint_drawer_v1/artifacts/phase1h_geometry_contract/goc_v3_contract.json
  goc_contract_id: GOC_V3_EXACT_ID_GEOMETRY_OWNERSHIP_CONTRACT
  legal_gripper_surface_geom_ids: [63, 81, 90]
  forbidden_robot_surface_geom_ids: [45, 47, 49, 54, 59]
  drawer_handle_geom_ids: [0, 1, 2, 3, 4, 5, 6, 7, 8]
  prohibited_authority:
    - GOC-v2 count-only legal_pad=29 forbidden=26 handle=9
    - runtime body-based legal=31 forbidden=27 without exact-ID role classification
    - legacy name-only contact reports
    - fixed drawer_handle_geom_ids=[0..8] as runtime authority without semantic verification
    - broad-link or broad-finger-shell contact as target

goc_v4_authority:
  authority_type: GOC_V4_DEDICATED_FINGER_PAD_EXACT_GEOM_ID_SETS
  goc_contract: experiments/mint/mint_drawer_v1/artifacts/phase1h_geometry_contract/goc_v4_contract.json
  per_instance_binding_required: true
  target_contact: legal_finger_pad_geom_ids <-> semantically bound drawer_handle_geom_ids only
  forbidden_contact: nonlegal robot surfaces <-> drawer_handle/drawer/cabinet
  broad_link_wrist_arm_finger_shell_target_rejected: true
  body_based_31_27_rejected: true
  name_only_contact_rejected: true
  fixed_global_ids_may_not_be_reused_without_instance_verification: true

claim_ladder_scope:
  layer1_harness_governance: required
  layer2_exact_goc_v4_authority: required
  layer3_reset_preaction_physical_plausibility: required
  layer4_endpoint_layout_feasibility: synthesize_or_reject
  layer4_corridor_keepout: conditional_if_endpoint_feasible
  layer4_dynamic_probe: conditional_if_corridor_passes
  layer4r_full_matrix_certification: conditional_if_dynamic_probe_passes
  layer5_teacher_pull_rollout: out_of_scope
  layer6_export_bundle: out_of_scope
  layer7_local_replay_render: out_of_scope
  layer8_mint_train_eval: out_of_scope

hard_gate_policy:
  no_science_before_no_bypass_preflight: true
  failed_gate_blocks_promotion: true
  endpoint_feasible_required_before_corridor: true
  corridor_required_before_dynamic_probe: true
  dynamic_probe_required_before_layer4r_matrix: true
  physical_robot_collision_cannot_be_demoted_to_create_pass: true
  positive_science_from_committed_clean_runtime_scope: true
  no_threshold_lowering: true
  no_forbidden_contact_as_target: true
  no_direct_qpos_drawer_opening: true

accessibility_layout_synthesis:
  problem_statement: >
    Find or reject a physically legal robot mount/base/reset/approach layout for
    the current model instances. The decision variables include base pose, base
    yaw, reset qpos, handle-frame contact offsets, and waypoint IK; the hard
    constraints are reset clearance, joint limits, exact GOC-v4 two-pad target
    geometry, forbidden robot keepout, approach-corridor collision legality, and
    dynamic low-penetration contact.
  synthesis_operators:
    - object_handle_frame_base_synthesis
    - expanded_base_yaw_grid_around_handle_access_cone
    - deterministic_multistart_two_pad_endpoint_ik
    - full_robot_forbidden_keepout_rejection_certificate
    - approach_corridor_verification
    - short_dynamic_probe_before_layer4r
  rejection_invariants:
    - handle_frame_ambiguous
    - reset_clearance_blocks_layout
    - two_pad_ik_residual_blocks_layout
    - two_pad_reachable_but_full_robot_keepout_blocks_layout
    - endpoint_feasible_but_corridor_keepout_blocks_layout
    - dynamics_blocks_after_kinematic_layout

repair_budget:
  max_total_wall_clock_hours: 10
  max_layout_synthesis_cycles: 4
  no_progress_cycles_before_stop: 2

