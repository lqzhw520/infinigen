target_gate: V11-G4_GOC-V4_ACCESSIBILITY_LAYOUT_SYNTHESIS_TO_LAYER4R

objective:
  summary: >
    Execute a harness-bound accessibility/layout synthesis campaign after safe
    collision proxy policy repair rejected demotion of physical robot collision
    geometry. This phase tests whether a physically consistent full-robot layout
    can jointly satisfy reset clearance, dedicated two-pad handle-frame endpoint
    IK, forbidden-contact keepout, approach corridor legality, short dynamic
    contact, and Layer4R robust contact certification.
  previous_gate: SAFE_COLLISION_PROXY_POLICY_REPAIR_WITH_VISUAL_PHYSICAL_CONSISTENCY_GUARD
  previous_closeout: SAFE_PROXY_REPAIR_REJECTED_PHYSICAL_COLLISION_ESSENTIAL
  previous_next_gate: ROBOT_MOUNT_LAYOUT_OR_DRAWER_ACCESSIBILITY_REDESIGN_WITH_PHYSICAL_COLLISION_GUARD
  claim_boundary: >
    This phase may certify Layer4R only after endpoint, corridor, and short
    dynamic gates pass. It may not claim teacher pull rollout, export bundle,
    local replay/render, MINT admission, or training.

