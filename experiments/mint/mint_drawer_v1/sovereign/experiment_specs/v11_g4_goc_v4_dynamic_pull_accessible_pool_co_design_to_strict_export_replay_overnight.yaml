terminal_outcomes:
  success:
    - DYNAMIC_PULL_ACCESSIBLE_POOL_STRICT_EXPORT_LOCAL_REPLAY_READY
  non_success:
    - TARGETED_DYNAMIC_PULL_POOL_SHARD_FAILED
    - FULL_DYNAMIC_PULL_CERTIFICATION_FAILED
    - STRICT_TEACHER_EXPORT_FAILED
    - LOCAL_STRICT_REPLAY_RENDER_FAILED
    - ACCESSIBLE_POOL_CO_DESIGN_INSUFFICIENT
    - TIME_BUDGET_EXHAUSTED
    - HARNESS_PREFLIGHT_FAILED
    - TASK_SPEC_LOCK_BINDING_FAILED
    - DIRTY_FORBIDDEN_SCOPE
    - EXECUTION_FAILED

next_gate_rules:
  if_success: MANUAL_VISUAL_AND_SCIENCE_REVIEW_BEFORE_MINT_DATASET_ADMISSION
  if_targeted_shard_fails: ANALYZE_DYNAMIC_PULL_POOL_CO_DESIGN_DEFECT_CERTIFICATES
  if_full30_fails: REPAIR_DYNAMIC_PULL_POOL_CERTIFICATION_DEFECTS
  if_export_fails: STRICT_EXPORT_INFRA_REPAIR
  if_local_replay_fails: LOCAL_STRICT_REPLAY_RENDER_REPAIR


