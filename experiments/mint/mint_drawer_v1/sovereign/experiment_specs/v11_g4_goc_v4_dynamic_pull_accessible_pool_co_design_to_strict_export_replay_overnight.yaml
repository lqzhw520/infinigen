    - scripts/mint/run_full_robot_teacher_probe.py
    - experiments/mint/mint_drawer_v1/sovereign/experiment_specs/v11_g4_goc_v4_dynamic_pull_accessible_pool_co_design_to_strict_export_replay_overnight.yaml
    - experiments/mint/mint_drawer_v1/runtime/v11_g4_goc_v4_dynamic_pull_accessible_pool_co_design_to_strict_export_replay_*
    - experiments/mint/mint_drawer_v1/sovereign/proposed_current_truth_delta_dynamic_pull_accessible_pool_co_design.json
