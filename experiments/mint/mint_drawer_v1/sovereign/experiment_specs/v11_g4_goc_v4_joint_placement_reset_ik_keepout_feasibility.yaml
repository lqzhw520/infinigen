    - TASK_SPEC_LOCK_BINDING_FAILED
    - DIRTY_FORBIDDEN_SCOPE
    - SEMANTIC_BINDING_AMBIGUOUS
    - PLACEMENT_RESET_IK_JOINT_FEASIBILITY_FAILED
