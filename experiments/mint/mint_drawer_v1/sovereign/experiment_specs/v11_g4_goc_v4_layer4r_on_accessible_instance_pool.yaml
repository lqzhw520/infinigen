closeout_states:
  success:
    - LAYER4R_ON_ACCESSIBLE_INSTANCE_POOL_PASSED
  non_success:
    - LAYER4R_RUNNER_POOL_BINDING_FAILED
    - DYNAMIC_CONTACT_POLICY_FAILED_ON_ACCESSIBLE_POOL
    - PERTURBATION_ROBUSTNESS_FAILED_ON_ACCESSIBLE_POOL
    - HARNESS_PREFLIGHT_FAILED
    - TASK_SPEC_LOCK_BINDING_FAILED
    - DIRTY_FORBIDDEN_SCOPE
    - TIME_BUDGET_EXHAUSTED
    - EXECUTION_FAILED

next_gate_on_success: GOC_V4_BOUNDED_TEACHER_PULL_ROLLOUT_ON_ACCESSIBLE_POOL
next_gate_on_runner_binding_failure: ACCESSIBLE_POOL_RUNNER_BINDING_REPAIR
next_gate_on_dynamic_failure: CONTACT_POLICY_REPAIR_ON_ACCESSIBLE_POOL

