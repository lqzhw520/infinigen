task_id: V11_G4_GOC_V4_LAYER4R_ON_ACCESSIBLE_INSTANCE_POOL_AUTONOMOUS_V1
task_type: LAYER4R_CERTIFICATION_ON_ACCEPTED_ACCESSIBLE_POOL_SCIENCE_PHASE
task_version: 1.0.0
phase: layer4r_on_accessible_instance_pool
target_gate: V11-G4_GOC-V4_LAYER4R_ON_ACCESSIBLE_INSTANCE_POOL

objective:
  summary: >
    Certify robust Layer4R stable dedicated finger-pad to handle contact dynamics
    only on the previously certified physical accessibility instance pool. This
    phase must first run a readiness smoke that proves the runner is bound to the
    accepted pool and not to legacy drawer seeds, stale fixed IDs, or name/body
    based authority. Layer4R matrix execution is allowed only after readiness
    smoke passes.
  previous_gate: V11_G4_GOC_V4_PHYSICAL_ACCESSIBILITY_INSTANCE_POOL_AUTONOMOUS_V1
  source_instance_pool_run_dir: experiments/mint/mint_drawer_v1/runtime/v11_g4_goc_v4_physical_accessibility_instance_pool_20260504T032604Z
  source_instance_pool_closeout: ACCESSIBLE_INSTANCE_POOL_READY_FOR_LAYER4R
  claim_boundary: >
    This phase certifies Layer4R contact dynamics only. It does not claim teacher
    pull rollout success, export bundle success, local replay/render success, or
    MINT dataset/train/eval success.

authority:
  repo: /mnt/afs2/zhuhaowu/infinigen
  branch: feature/mint-env-reformulation-v1-visual-fidelity
  campaign_root: experiments/mint/mint_drawer_v1
  goc_authority: GOC_V4_DEDICATED_FINGER_PAD_EXACT_GEOM_AUTHORITY
  per_instance_binding_required: true
  accepted_pool_manifest_required: true
  fixed_global_ids_forbidden_without_instance_verification: true
  body_based_31_27_forbidden: true
  name_only_contact_authority_forbidden: true
  broad_link_wrist_arm_finger_shell_target_contact_forbidden: true

# Validator-compatible baseline authority. Runtime authority for this phase is
# GOC-v4 per-instance dedicated-pad binding; this block keeps the existing V01
# production validator anchored to the GOC-v3 exact-ID baseline and fixtures.
task_authority:
  authority_type: GOC_V3_EXACT_GEOM_ID_SETS_AS_SOURCE_BASELINE_FOR_GOC_V4_LAYER4R_ON_POOL
  goc_version: v3
  goc_artifact_path: artifacts/phase1h_geometry_contract/goc_v3_contract.json
  goc_contract: experiments/mint/mint_drawer_v1/artifacts/phase1h_geometry_contract/goc_v3_contract.json
  goc_contract_id: GOC_V3_EXACT_ID_GEOMETRY_OWNERSHIP_CONTRACT
  legal_gripper_surface_geom_ids: [63, 81, 90]
  forbidden_robot_surface_geom_ids: [45, 47, 49, 54, 59]
  drawer_handle_geom_ids: [0, 1, 2, 3, 4, 5, 6, 7, 8]
  prohibited_authority:
    - GOC-v2 count-only legal_pad=29 forbidden=26 handle=9
    - runtime body-based legal=31 forbidden=27 without exact-ID role classification
    - legacy name-only contact reports
    - fixed drawer_handle_geom_ids=[0..8] as runtime authority without semantic verification
    - broad-link, wrist, arm, or finger shell contact as target

goc_v4_authority:
  authority_type: GOC_V4_DEDICATED_FINGER_PAD_EXACT_GEOM_ID_SETS
  per_instance_binding_required: true
  source_pool_manifest: experiments/mint/mint_drawer_v1/runtime/v11_g4_goc_v4_physical_accessibility_instance_pool_20260504T032604Z/accepted_instance_pool_manifest.json
  target_contact: legal_finger_pad_geom_ids <-> semantically_bound_drawer_handle_geom_ids only
  forbidden_contact: nonlegal robot surfaces <-> drawer_handle/drawer/cabinet
  broad_link_wrist_arm_finger_shell_target_rejected: true
  body_based_31_27_rejected: true
  name_only_contact_rejected: true
  fixed_global_ids_may_not_be_reused_without_instance_verification: true

accepted_instance_pool:
  required_source_run_dir: experiments/mint/mint_drawer_v1/runtime/v11_g4_goc_v4_physical_accessibility_instance_pool_20260504T032604Z
  required_source_closeout: ACCESSIBLE_INSTANCE_POOL_READY_FOR_LAYER4R
  accepted_instance_ids:
    - generated_knob_drawer_accessible_001
    - generated_knob_drawer_accessible_002
    - generated_knob_drawer_accessible_003
    - generated_knob_drawer_accessible_004
    - generated_knob_drawer_accessible_005
  minimum_instances: 3
  no_legacy_instance_fallback: true
  no_pool_modification_during_certification: true

readiness_smoke_required:
  run_before_layer4r_matrix: true
  verify_accepted_manifest_origin_visible: true
  verify_model_xml_and_asset_hashes: true
  verify_each_accepted_instance_reloads: true
  verify_exact_per_instance_goc_v4_binding: true
  verify_reset_clean: true
  verify_accessibility_oracle_recertifies: true
  verify_no_legacy_seed_ids_used: true
  verify_no_fixed_global_goc_v4_ids_reused_without_instance_semantics: true
  failure_closeout: LAYER4R_RUNNER_POOL_BINDING_FAILED

layer4r_matrix:
  instances: accepted_instance_pool_only
  perturbations:
    - nominal
    - qpos_small_plus
    - qpos_small_minus
    - slow_guarded_contact
    - fast_guarded_contact
    - late_close
  target_contact_total_frames_min: 50
  target_contact_max_consecutive_frames_min: 30
  forbidden_contact_frames: 0
  handle_nonlegal_contact_frames: 0
  max_penetration_m: 0.02
  max_force_n: 1000000.0
  reset_forbidden_contact_frames: 0
  reset_max_penetration_m: 0.02
  direct_qpos_drawer_opening: false
  drawer_motor_command_abs_max: 0.0
  exact_goc_v4_target_pairs_only: true

success_requires:
  readiness_smoke_passed: true
  layer4r_matrix_attempted: true
  all_accepted_pool_cases_pass_layer4r: true
  current_truth_modified: false
  next_actions_modified: false
  external_MINT_modified: false

allowed_files:
  - scripts/mint/v11_g4_layer4r_on_accessible_instance_pool.py
  - experiments/mint/mint_drawer_v1/sovereign/experiment_specs/v11_g4_goc_v4_layer4r_on_accessible_instance_pool.yaml
  - experiments/mint/mint_drawer_v1/runtime/v11_g4_goc_v4_layer4r_on_accessible_instance_pool_*
  - experiments/mint/mint_drawer_v1/sovereign/proposed_current_truth_delta_goc_v4_layer4r_on_accessible_instance_pool.json
  - experiments/mint/mint_drawer_v1/sovereign/proposed_next_actions_goc_v4_layer4r_on_accessible_instance_pool.json
  - experiments/mint/mint_drawer_v1/autopilot/agent_execution_harness_lock.json
  - experiments/mint/mint_drawer_v1/autopilot/agent_execution_harness_attestation.json

remote:
