    - scripts/mint/v11_g4_layer4r_on_accessible_instance_pool.py
    - experiments/mint/mint_drawer_v1/sovereign/experiment_specs/v11_g4_goc_v4_layer4r_on_accessible_instance_pool.yaml
    - experiments/mint/mint_drawer_v1/runtime/v11_g4_goc_v4_layer4r_on_accessible_instance_pool_*
    - experiments/mint/mint_drawer_v1/sovereign/proposed_current_truth_delta_goc_v4_layer4r_on_accessible_instance_pool.json
    - experiments/mint/mint_drawer_v1/sovereign/proposed_next_actions_goc_v4_layer4r_on_accessible_instance_pool.json
    - experiments/mint/mint_drawer_v1/autopilot/agent_execution_harness_lock.json
    - experiments/mint/mint_drawer_v1/autopilot/agent_execution_harness_attestation.json
  forbidden_files:
