objective:
  summary: >
    Execute a harness-bound P0 forensic repair campaign after the schema-aware
    model placement keepout repair stalled. The phase attributes exact offending
    contact pairs at the best reset-clean near-IK endpoints, classifies whether
    the blocker is collision policy, robot mount/layout, handle accessibility,
    pad/handle geometry, or model-instance rejection invariant, and only then
    attempts bounded safe what-if repair/rerun. It must not repeat the previous
    broad grid or controller CEM loop before pair-level attribution.
  previous_gate: V11_G4_GOC_V4_MODEL_PLACEMENT_KEEP_OUT_REPAIR_TO_LAYER4R_CERTIFY_OVERNIGHT_V1
  previous_closeout: MODEL_PLACEMENT_KEEP_OUT_REPAIR_STALLED_WITH_SCHEMA_AWARE_CERTIFICATE
  previous_result:
    model_placement_repair_cycles_run: 4
    feasible_seed_count: 0
    feasible_case_count: 0
    best_reset_clean_two_pad_residual_m: 0.0011419128005339195
    remaining_clusters:
      - pregrasp_forbidden_contact
      - guarded_forbidden_contact
      - contact_hold_forbidden_contact
      - pregrasp_penetration_gt_threshold
      - guarded_penetration_gt_threshold
      - contact_hold_penetration_gt_threshold
  claim_boundary: >
    This phase may claim P0 model-instance accessibility/collision attribution
    repair only if exact offending geometry class is identified and a safe source
    repair or source-level rejection invariant is validated. It may not claim
    teacher pull rollout, export, local replay/render, MINT admission, or training.

