forensic_questions:
  - exact offending geom pairs by pregrasp/guarded/contact_hold stage
  - whether offending robot geoms are physical arm/wrist/hand bodies, duplicate broad proxy shells, pad supports, or wrong target pads
  - whether offending scene geoms are active handle, non-target handle, drawer body, cabinet, or unknown contact surfaces
  - whether maximum penetration is target pad-handle or forbidden robot-scene penetration
  - whether a what-if demotion of proven duplicate broad proxy geoms removes violations without silently accepting forbidden contact
  - whether handle frame accessibility leaves a collision-free approach envelope for dedicated pads
  - if no safe repair exists, which production invariant must reject or rebuild the model instance

repair_operators:
