task_id: V11_G4_GOC_V4_MODEL_OR_LAYOUT_REDESIGN_WITH_PHYSICAL_ACCESSIBILITY_INVARIANT_V1
task_type: MODEL_LAYOUT_REDESIGN_WITH_PHYSICAL_ACCESSIBILITY_INVARIANT_SCIENCE_PHASE
task_version: "1.0.0"
phase: model_or_layout_redesign_with_physical_accessibility_invariant
target_gate: V11-G4_GOC-V4_MODEL_OR_LAYOUT_REDESIGN_WITH_PHYSICAL_ACCESSIBILITY_INVARIANT

objective:
  summary: >
    Execute a harness-bound repair phase that may modify or synthesize robot
    mount/layout policy while preserving GOC-v4 exact-ID governance and
    visual/physical consistency. The primary blocker is the joint feasibility
    condition: dedicated two-pad handle-frame reachability + reset clearance +
    full robot forbidden-contact keepout. The phase must either increase accepted
    accessible model instances and certify Layer4R, or produce a physical
    accessibility invariant explaining why structural redesign remains required.
  previous_gate: MODEL_OR_LAYOUT_REDESIGN_WITH_PHYSICAL_ACCESSIBILITY_INVARIANT
  claim_boundary: >
    This phase may certify Layer4R only after model/layout repair, per-instance
    GOC-v4 binding, endpoint, signed-clearance, approach corridor, and short
    dynamic gates pass. It may not claim teacher pull rollout, export bundle,
    local replay/render, MINT admission, or training.

authority:
  repo: /mnt/afs2/zhuhaowu/infinigen
  branch: feature/mint-env-reformulation-v1-visual-fidelity
  campaign_root: experiments/mint/mint_drawer_v1
  goc_authority: GOC_V4_DEDICATED_FINGER_PAD_EXACT_GEOM_AUTHORITY
  per_instance_binding_required: true
  fixed_drawer_handle_ids_forbidden_unless_semantically_verified: true
  body_based_31_27_forbidden: true
  name_only_contact_report_forbidden: true
  broad_link_wrist_arm_finger_shell_target_contact_forbidden: true

# Harness V01 still validates the immutable GOC-v3 source baseline. Runtime
# science authority for this phase is per-instance GOC-v4 dedicated pad binding.
task_authority:
  authority_type: GOC_V3_EXACT_GEOM_ID_SETS_AS_SOURCE_BASELINE_FOR_GOC_V4_MODEL_LAYOUT_REDESIGN
  goc_version: v3
  goc_artifact_path: artifacts/phase1h_geometry_contract/goc_v3_contract.json
  goc_contract: experiments/mint/mint_drawer_v1/artifacts/phase1h_geometry_contract/goc_v3_contract.json
  goc_contract_id: GOC_V3_EXACT_ID_GEOMETRY_OWNERSHIP_CONTRACT
  legal_gripper_surface_geom_ids: [63, 81, 90]
  forbidden_robot_surface_geom_ids: [45, 47, 49, 54, 59]
  drawer_handle_geom_ids: [0, 1, 2, 3, 4, 5, 6, 7, 8]
  prohibited_authority:
    - GOC-v2 count-only legal_pad=29 forbidden=26 handle=9
    - runtime body-based legal=31 forbidden=27 without exact-ID role classification
    - legacy name-only contact reports
    - fixed drawer_handle_geom_ids=[0..8] as runtime authority without semantic verification
    - broad-link, wrist, arm, or finger shell contact as target

goc_v4_authority:
  authority_type: GOC_V4_DEDICATED_FINGER_PAD_EXACT_GEOM_ID_SETS
  goc_contract: experiments/mint/mint_drawer_v1/artifacts/phase1h_geometry_contract/goc_v4_contract.json
  per_instance_binding_required: true
  target_contact: legal_finger_pad_geom_ids <-> semantically bound drawer_handle_geom_ids only
  forbidden_contact: nonlegal robot surfaces <-> drawer_handle/drawer/cabinet
  broad_link_wrist_arm_finger_shell_target_rejected: true
  body_based_31_27_rejected: true
  name_only_contact_rejected: true
  fixed_global_ids_may_not_be_reused_without_instance_verification: true

claim_ladder_scope:
  layer1_harness_governance: required
  layer2_exact_goc_v4_authority: required
  layer3_reset_preaction_physical_plausibility: required
  layer4_model_layout_accessibility: repair_and_certify_or_reject
  layer4_endpoint_two_pad_feasibility: conditional_after_repair
  layer4_corridor_keepout: conditional_after_endpoint
  layer4_dynamic_probe: conditional_after_corridor
  layer4r_full_matrix_certification: conditional_after_dynamic
  layer5_teacher_pull_rollout: out_of_scope
  layer6_export_bundle: out_of_scope
  layer7_local_replay_render: out_of_scope
  layer8_mint_train_eval: out_of_scope

hard_gate_policy:
  no_science_before_no_bypass_preflight: true
  failed_gate_blocks_promotion: true
  model_layout_repair_must_preserve_visual_physical_consistency: true
  goc_v4_exact_ids_must_be_regenerated_or_reverified_after_geometry_change: true
  endpoint_feasible_required_before_corridor: true
  corridor_required_before_dynamic_probe: true
  dynamic_probe_required_before_layer4r_matrix: true
  positive_science_from_committed_clean_runtime_scope: true
  no_threshold_lowering: true
  no_forbidden_contact_as_target: true
  no_direct_qpos_drawer_opening: true
  no_handle_or_drawer_geometry_mutation_to_fake_success: true

repair_strategy:
  problem_statement: >
    Find or reject a physically legal model/layout repair for the current model
    instances. Decision variables include robot mount position including height,
    robot mount yaw, reset qpos, handle-frame contact offsets, and endpoint/corridor
    waypoints. Hard constraints include reset clearance, joint limits, dedicated
    two-pad handle contact geometry, forbidden robot keepout, corridor collision
    legality, and dynamic low-penetration contact.
  allowed_repair_operators:
    - per_instance_robot_mount_policy_synthesis
    - robot_mount_height_and_yaw_redesign
    - object_handle_frame_accessibility_envelope_resynthesis
    - signed_rbound_clearance_oracle
    - deterministic_multistart_two_pad_endpoint_ik
    - full_robot_corridor_verification
    - short_dynamic_probe_before_layer4r
  forbidden_repair_operators:
    - demote_physical_hand_wrist_arm_collisions_to_create_pass
    - mutate_handle_or_drawer_geometry_to_fake_success
    - change_thresholds_after_seeing_results
    - use_body_based_or_name_only_contact_authority

thresholds:
  endpoint_two_pad_residual_max_m: 0.02
  reset_max_penetration_m: 0.02
  reset_max_contact_force_n: 1000000.0
  signed_forbidden_scene_clearance_reported_m: true
  corridor_max_penetration_m: 0.02
  dynamic_max_penetration_m: 0.02
  dynamic_max_force_n: 1000000.0
  dynamic_target_contact_consecutive_min: 10
  layer4r_target_contact_total_frames_min: 50
  layer4r_target_contact_max_consecutive_frames_min: 30
  forbidden_contact_frames: 0
  handle_nonlegal_contact_frames: 0

repair_budget:
  max_total_wall_clock_hours: 10
  max_model_layout_repair_cycles: 4
  no_progress_cycles_before_stop: 2

