target_gate: V11-G4_GOC-V4_MODEL_PLACEMENT_KEEP_OUT_TO_LAYER4R_CERTIFY

objective:
  summary: >
    Run a harness-bound autonomous overnight repair-and-certify campaign from
    the clean schema-aware Stage3 infeasibility point. The phase repairs the
    coupled model/placement/reset/two-pad-IK/keepout constraints, reruns
    schema-aware endpoint feasibility, promotes only through hard gates
    (corridor, dynamic probe, Layer4R), and optionally continues to strict pull
    rollout/export/local replay only after robust Layer4R certification.
  previous_gate: V11_G4_GOC_V4_SCHEMA_AWARE_MODEL_PLACEMENT_FEASIBILITY_REPAIR_V1
  previous_closeout: SCHEMA_AWARE_STAGE3_MODEL_PLACEMENT_INFEASIBLE
  previous_result:
    schema_error_count: 0
    all_mandatory_seeds_stage3_without_indexing_errors: true
    endpoint_feasible_candidate_count: 0
    best_overall_two_pad_residual_m: 0.017613888435584424
  claim_boundary: >
    This phase may certify Layer4R only after endpoint, corridor, and short
    dynamic gates pass. It may not claim teacher rollout/export/local replay
    unless the corresponding later stages actually pass with artifacts.

