    - generated_knob_drawer_accessible_004
    - generated_knob_drawer_accessible_005

# Validator-compatible baseline authority. Runtime authority for this phase is
# GOC-v4 per-instance dedicated-pad binding from the accepted pool and bounded
# pull traces. This block keeps the existing V01 production validator anchored
# to the GOC-v3 exact-ID fixture interface.
task_authority:
  authority_type: GOC_V3_EXACT_GEOM_ID_SETS_AS_SOURCE_BASELINE_FOR_GOC_V4_PULL_FORCE_REPAIR_ON_POOL
  goc_version: v3
  goc_artifact_path: artifacts/phase1h_geometry_contract/goc_v3_contract.json
  goc_contract: experiments/mint/mint_drawer_v1/artifacts/phase1h_geometry_contract/goc_v3_contract.json
  goc_contract_id: GOC_V3_EXACT_ID_GEOMETRY_OWNERSHIP_CONTRACT
  legal_gripper_surface_geom_ids: [63, 81, 90]
  forbidden_robot_surface_geom_ids: [45, 47, 49, 54, 59]
  drawer_handle_geom_ids: [0, 1, 2, 3, 4, 5, 6, 7, 8]
  prohibited_authority:
    - GOC-v2 count-only legal_pad=29 forbidden=26 handle=9
    - runtime body-based legal=31 forbidden=27 without exact-ID role classification
    - legacy name-only contact reports
    - fixed drawer_handle_geom_ids=[0..8] as runtime authority without semantic verification
    - broad-link, wrist, arm, or finger shell contact as target

goc_v4_authority:
  authority_type: GOC_V4_DEDICATED_FINGER_PAD_EXACT_GEOM_ID_SETS
  per_instance_binding_required: true
  accepted_pool_manifest: experiments/mint/mint_drawer_v1/runtime/v11_g4_goc_v4_physical_accessibility_instance_pool_20260504T032604Z/accepted_instance_pool_manifest.json
  target_contact: legal_finger_pad_geom_ids <-> semantically_bound_drawer_handle_geom_ids only
  forbidden_contact: nonlegal robot surfaces <-> drawer_handle/drawer/cabinet
  broad_link_wrist_arm_finger_shell_target_rejected: true
  body_based_31_27_rejected: true
  name_only_contact_rejected: true
  fixed_global_ids_may_not_be_reused_without_instance_verification: true

fixed_scope:
  fixed_accepted_pool_only_before_forensic_redesign_decision: true
  pool_modified: false
  geometry_modified: false
  goc_v4_authority_modified: false
  thresholds_modified: false
  collision_demotion_allowed: false
  direct_drawer_qpos_allowed: false
  drawer_motor_command_allowed: false
  training_allowed: false
  mint_eval_allowed: false
  local_visual_success_claim_allowed_without_artifacts: false

