phase: pull_force_impedance_axis_alignment_repair_to_strict_export_local_replay
target_gate: PULL_FORCE_IMPEDANCE_AXIS_ALIGNMENT_REPAIR

objective:
  summary: >-
    Repair dynamic bounded pull execution on the fixed GOC-v4 accepted accessible
    instance pool, then immediately proceed to strict teacher export and local
    strict replay if full fixed-pool pull certification passes. If fixed-pool
    pull certification fails, produce a pull-wrench forensic certificate and
    execute the scientifically selected continuation branch.
  primary_gate: PULL_FORCE_IMPEDANCE_AXIS_ALIGNMENT_REPAIR
  success_next_gate: STRICT_TEACHER_EXPORT_LOCAL_REPLAY_ON_ACCESSIBLE_POOL
  failure_branch_options:
    - PULL_CONTROLLER_REPAIR_CONTINUATION
    - DYNAMIC_PULL_ACCESSIBLE_POOL_REDESIGN
  claim_boundary: >-
    This phase is fixed accepted-pool only until a forensic decision explicitly
    selects the redesign branch. It does not claim all-seed generalization,
    local visual success, MINT admission, training, or evaluation success.

