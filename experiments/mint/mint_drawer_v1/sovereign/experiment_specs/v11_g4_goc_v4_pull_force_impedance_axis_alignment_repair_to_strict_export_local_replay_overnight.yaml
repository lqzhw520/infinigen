  - AXIS_FORCE_INSUFFICIENT
  - FORCE_PRESENT_BUT_CONTACT_DROPOUT
  - FORCE_PRESENT_BUT_DRAWER_NONMONOTONIC
  - TWO_PAD_PULL_CONTACT_LOSS
  - GRIPPER_TIMING_OR_SPAN_FAILURE
  - FORBIDDEN_KEEP_OUT_DURING_PULL
  - IMPEDANCE_OSCILLATION
  - HANDLE_FRAME_TRACKING_ERROR
  - LIKELY_FIXED_POOL_DYNAMIC_PULL_INFEASIBLE
  - INSUFFICIENT_EVIDENCE

repair_controls:
  max_total_wall_clock_hours: 10
  max_primary_controller_cycles: 8
  targeted_shard_before_full_matrix: true
  full_30_case_certification_only_after_targeted_pass: true
  branch_decision_required_on_failure: true
  execute_selected_failure_branch_before_closeout: true
  strict_export_and_local_replay_required_after_pull_pass: true

targeted_shard:
  source: bounded_teacher_pull_run failures
  cases:
    - [generated_knob_drawer_accessible_001, nominal]
    - [generated_knob_drawer_accessible_001, slow_guarded_contact]
    - [generated_knob_drawer_accessible_002, nominal]
    - [generated_knob_drawer_accessible_002, slow_guarded_contact]
    - [generated_knob_drawer_accessible_003, nominal]
    - [generated_knob_drawer_accessible_004, nominal]
    - [generated_knob_drawer_accessible_005, nominal]

pass_criteria:
  per_case:
    reset_forbidden_contact_frames: 0
    reset_max_penetration_m: 0.02
    reset_max_force_n: 1000000.0
    target_contact_frames_min: 80
    target_contact_max_consecutive_frames_min: 30
    pull_phase_target_contact_frames_min: 80
    pull_phase_two_pad_target_contact_frames_min: 30
    forbidden_contact_frames: 0
    handle_nonlegal_contact_frames: 0
    max_penetration_m: 0.02
    max_force_n: 1000000.0
    drawer_fraction_min: 0.80
    hard_goal_drawer_fraction_min: 0.90
    drawer_qpos_nondecreasing_during_pull: true
    drawer_qpos_nondecreasing_tolerance_m: 0.0001
    drawer_fraction_increase_requires_prior_or_concurrent_target_contact: true
    opening_must_be_physics_contact_caused: true
    no_direct_qpos_drawer_opening: true
    drawer_motor_command_abs_max: 0.0
    untrimmed_trace_required: true
  matrix:
    full_cases_total: 30
    all_30_cases_must_pass_for_certification: true
    failures_must_report_exact_clusters: true

allowed_policy_changes:
  - handle-frame moving target tracking
  - pull-axis force and impedance alignment
  - two-pad contact retention
  - phase-aware gripper close timing
  - bounded contact reseat and recovery
  - keepout-aware nullspace/backoff recovery
  - bounded wrist roll or approach-yaw variants from existing legal precontact states
  - diagnostic attribution and trace logging

branch_selection_rules:
  pull_controller_repair_continuation_if:
    - positive pull-axis wrench exists but is unstable or intermittent
    - failures are contact dropout, gripper timing, or impedance oscillation
    - forbidden contact appears only under specific controller variants
    - at least one legal variant opens the drawer substantially on the failing instance
    - changing controller mode improves strict pass count or key metrics
    - no evidence that geometry, mount, or handle makes legal dynamic pull impossible
  dynamic_pull_accessible_pool_redesign_if:
    - legal two-pad contact cannot be maintained while generating positive pull-axis wrench
    - every keepout-safe controller variant fails opening
    - every opening-capable variant causes forbidden contact or illegal target contact
    - failure is tied to handle, cabinet, robot accessibility envelope rather than controller timing
    - evidence is per-instance and not inferred from one rollout

