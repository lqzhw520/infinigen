forensic_questions:
  - Are link5_collision, link6_collision, link7_collision, and hand_collision duplicate proxy shells or real physical visual bodies?
  - Does each offender have a same-body visual counterpart with comparable rbound/AABB?
  - Would demoting the offender ignore visible palm, wrist, or arm occupancy?
  - Does any safe duplicate-only policy repair remain after broad finger shells were already demoted?
  - If no safe repair exists, is the blocker structural mount/layout/accessibility rather than collision proxy policy?

thresholds:
  endpoint_two_pad_residual_max_m: 0.02
  reset_max_penetration_m: 0.02
  reset_max_contact_force_n: 1000000.0
  max_penetration_m: 0.02
  max_force_n: 1000000.0
  layer4r_target_contact_total_frames_min: 50
  layer4r_target_contact_max_consecutive_frames_min: 30

closeout_states:
