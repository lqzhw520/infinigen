      - canonical_topology_render_manifest.json
      - visual_topology_review_packet.md
  - id: stage_3_topology_lock
    outputs:
      - experiments/mint/mint_drawer_v1/sovereign/approved_drawer_topology_lock.json
    notes:
      - manual_visual_review_passed_must_remain_false_until_human_review
      - machine_reference_contract_passed_may_gate_controller_recertification
  - id: stage_4_controller_preserving_fast_recertification
    pass_requires:
      - fast_guarded_contact_passed
      - exact_pad_group_bilateral_contact
      - forbidden_zero
      - handle_nonlegal_zero
      - max_penetration_le_0p02
  - id: stage_5_targeted_7_of_7
    enter_only_if: stage_4_passed
  - id: stage_6_full30
    enter_only_if: targeted_7_of_7_passed
  - id: stage_7_strict_export
    enter_only_if: full30_passed
  - id: stage_8_local_state_replay_render
    enter_only_if: strict_export_complete
  - id: stage_9_action_only_spot_check
    enter_only_if: local_state_replay_render_passed
  - id: stage_10_final_checks_commit_push

