reference_aligned_topology_contract:
  solid_drawer_front_panel:
    required: true
    single_solid_front_geom_required: true
    frame_only_front_rejected: true
    segmented_edge_frame_rejected: true
  short_stub_spherical_knob:
    required: true
    knob_kind: spherical
    boss_or_stub_required: true
    stub_length_max_ratio_of_knob_diameter: 0.35
    preferred_stub_length_ratio_range: [0.10, 0.25]
    nearly_flush_to_front_required: true
    long_rod_rejected: true
  moving_drawer_box_tray:
    required: true
    required_moving_parts:
      - front_panel
      - left_side_wall
      - right_side_wall
      - bottom_panel
      - back_panel
    open_top_allowed: true
    front_only_or_frame_only_body_rejected: true
  support_guide_semantics:
    required: true
    visible_support_or_guide_geometry_required: true
    invisible_support_only_rejected: true
  visual_physical_consistency:
    required: true
    topology_oracle_must_parse_model_xml: true
    claim_render_must_show_reference_semantics: true

controller_preservation:
  preserve_round_knob_exact_latch_pull_controller_algorithm: true
  allowed_controller_action: migrate_existing_successful_controller_to_repaired_topology
  forbidden_controller_actions:
    - change_controller_algorithm
    - lower_thresholds
    - direct_qpos_open_drawer
    - drawer_motor_command
    - accept_forbidden_contact
    - use_geometric_proxy_as_success
    - count_broad_shell_link_wrist_arm_or_finger_shell_as_target
  required_recertification:
    - fast_guarded_contact
    - targeted_7_of_7
    - full30
    - strict_export
    - local_state_replay_render
    - action_only_spot_check

