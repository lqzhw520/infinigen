success_criteria:
  - id: SC01
    description: Production lock binds this reset/model-builder repair spec path/hash and preflight passes with no bypass.
  - id: SC02
    description: Model inventory and collision overlap diagnosis identify the reset interpenetration source.
  - id: SC03
    description: If a minimal model-builder repair is made, GOC-v3 exact-ID authority remains unchanged.
  - id: SC04
    description: Reset/preaction smoke passes only if forbidden contacts at reset are zero, max penetration <= 0.02 m, and max force <= 1e6 N.
  - id: SC05
    description: No rollout, render, training, direct-qpos drawer opening, threshold lowering, or current_truth/next_actions direct mutation occurs.

forbidden:
  - id: F01
    description: Do not directly mutate sovereign/current_truth.json or sovereign/next_actions.json.
  - id: F02
    description: Do not train, fine-tune, or run evaluation rollout.
  - id: F03
    description: Do not claim visual artifact success without local replay/render evidence.
  - id: F04
    description: Do not use body-based 31/27 or legacy name-only contact reports as authority.
  - id: F05
    description: Do not count forbidden contact as target or broaden legal target IDs.
  - id: F06
    description: Do not use direct-qpos drawer opening or trimmed rollout success claim.

