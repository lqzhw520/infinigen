spec_id: gate_b_teacher_replayability
family: learnability_audit
canonical_artifact: artifacts/gate_b_teacher_replayability/gate_b_replay_summary.json
auto_publish: false
requires_scope_guardrail: true
must_be_verified_for_current_truth: false
bindings:
  action_types:
    - learnability_audit_gate
  action_ids:
    - gate_b_teacher_replayability
collector:
  command: >-
    cd /mnt/afs2/zhuhaowu/infinigen &&
    python scripts/mint/run_gate_b_teacher_replayability.py
    --output-dir /mnt/afs2/zhuhaowu/infinigen/experiments/mint/mint_drawer_v1/artifacts/gate_b_teacher_replayability
  artifact: /mnt/afs2/zhuhaowu/infinigen/experiments/mint/mint_drawer_v1/artifacts/gate_b_teacher_replayability/gate_b_replay_summary.json
required_schema_fields:
  - mode_results
  - episodes
  - aggregate
allowed_conclusion_vocabulary:
  - replayability
  - physics compatibility
  - attach
  - teacher executability
  - oracle reachability
disallowed_phrases:
  - physics confirmed
  - root cause solved
  - policy learnability confirmed
  - MINT cannot learn
  - image domain eliminated
scope_guardrails:
  - Gate B tests teacher replayability inside DrawerRobotEnv
  - Gate B is not a direct policy learning verdict
  - Gate B must distinguish replay failure stage and env reachability
