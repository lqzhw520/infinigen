findings:
  q1_are_teacher_targets_executable_in_current_env:
    answer: YES_SUBSTANTIALLY
    detail: >
      The audit does not support a pure executability failure story. In open-loop
      replay, 9/10 episodes attach and 5/10 complete success. In state-anchored
      replay, 10/10 attach and 6/10 complete success. Oracle reachability succeeds
      in all 10/10 episodes.

  q2_is_pure_physics_or_contract_gap_supported:
    answer: NO
    detail: >
      The deterministic Gate B rule for physics_or_contract_gap_likely requires
      both replay modes to fail attach while oracle succeeds. The observed data do
      not satisfy that branch. This draft therefore does not support "pure physics
      or contract gap" as the leading explanation.

  q3_what_failure_stage_dominates_when_runs_fail:
    answer: PULL_NO_OPEN
    detail: >
      Most failed runs are not "never near handle" failures. The dominant failed
      stage is pull_no_open, with only a single near_handle_no_attach case in
      open-loop replay (episode 157). This suggests that the remaining gap is more
      about successful pull execution robustness than broad inability to reach/attach.

methodology_caveat: |
  The canonical top-10 Gate B NPZs are legacy physics-legal rollout files, not
  full native teacher-rollout artifacts. They do not carry sidecar JSON metadata,
  `grasp_pose_local_*`, `eef_quaternions`, or `next_drawer_fraction`.

  To keep the audit executable on current data, the collector reconstructs handle
  semantics from the current env using `anygrasp_payload()` / current-env handle
  center heuristics and applies legacy-compatible state-restore fallbacks.

  Therefore, this draft supports:
    "teacher actions are substantially executable under current-env handle semantics"
  but it is NOT a perfect proof of exact source-grasp replay fidelity.

implications_for_mainline:
  supported:
    - Gate B does not support `physics_or_contract_gap_likely` as the current leading interpretation.
    - Gate B supports `teacher_actions_executable_policy_gap_remains`.
    - Gate B supports keeping the mainline focused on executability / policy-gap analysis rather than blind retraining.
  not_supported:
    - final root cause solved
    - MINT will necessarily learn from the current data
    - image domain eliminated
    - upstream-faithful MINT conclusion

recommended_next_questions:
  - Why do 4/10 open-loop runs and 4/10 state-anchored runs still fail at `pull_no_open`?
  - What action precision or controller robustness is needed to convert attach into stable open success?
  - How much of the remaining gap is due to policy robustness versus current model fidelity (`F2`)?
  - Does richer image domain still matter once teacher executability is no longer the primary blocker?

do_not:
  - Do NOT promote this draft directly into `sovereign/evidence/` without daylight review.
  - Do NOT claim `physics confirmed` or `root cause solved`.
  - Do NOT claim `MINT cannot learn`.
  - Do NOT claim `image domain eliminated`.
  - Do NOT treat current-env heuristic handle semantics as an exact proof of source-grasp replay fidelity.
