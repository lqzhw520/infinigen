summary: |
  Gate B asks whether source-successful teacher actions are executable in the
  current DrawerRobotEnv contract, and if not, at which execution layer they fail.

  On the canonical top-10 episodes from Gate A, the current Gate B collector finds:
    - open_loop_attach_rate = 0.9
    - open_loop_success_rate = 0.5
    - state_anchored_attach_rate = 1.0
    - state_anchored_success_rate = 0.6
    - oracle_reachability_rate = 1.0

  The collector's deterministic interpretation is:
    decision_support = teacher_actions_executable_policy_gap_remains

  This weakens the hypothesis that the current pipeline is blocked by a pure
  "teacher target is not executable in DrawerRobotEnv" failure. Teacher actions
  are substantially executable in the current env, and the env task itself is
  fully reachable under the oracle script.

